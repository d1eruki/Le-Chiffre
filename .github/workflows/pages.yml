name: Публикация Le Chiffre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7
      - name: Подготовить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Собрать зашифрованный квест
        run: node scripts/build-site.mjs
      - name: Проверить сборку и прохождение
        run: node --test scripts/build-site.test.mjs
      - name: Подготовить Pages
        uses: actions/configure-pages@v5
      - name: Загрузить только опубликованные файлы
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
